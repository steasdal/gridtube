name: Build & Push (Develop)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-develop:
    name: Build & Push multi-arch develop image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for syntax verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify application JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=develop-

      - name: Build and push multi-arch Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write published image tags to Job Summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published Container Image Tags"
            echo ""
            echo "| Image Tag | Platforms | Digest |"
            echo "| :--- | :--- | :--- |"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "| \`$tag\` | \`linux/amd64, linux/arm64\` | \`$DIGEST\` |"
            done <<< "$TAGS"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout GitOps repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: steasdal/gitops
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Update develop image tag in GitOps repository
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          DEV_IMAGE=$(grep -E ':develop-[0-9a-f]+$' <<< "$TAGS" | head -n 1)
          if [ -z "$DEV_IMAGE" ]; then
            echo "Error: Could not find develop-<sha> tag in metadata output"
            exit 1
          fi
          echo "Updating apps/gridtube/dev/02-app.yaml to image: ${DEV_IMAGE}"
          cd gitops
          sed -i -E "s|(image:[[:space:]]*)ghcr\.io/steasdal/gridtube:[^[:space:]]+|\1${DEV_IMAGE}|" apps/gridtube/dev/02-app.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet apps/gridtube/dev/02-app.yaml; then
            echo "No changes to commit in apps/gridtube/dev/02-app.yaml"
          else
            git add apps/gridtube/dev/02-app.yaml
            git commit -m "chore(gridtube-dev): update image to ${DEV_IMAGE#*:}"
            git pull --rebase origin main
            git push origin main
            echo "Updated \`steasdal/gitops\` (\`apps/gridtube/dev/02-app.yaml\`) to \`${DEV_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
