name: Build & Push (Release)

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]*"
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-release:
    name: Build & Push multi-arch release image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for syntax verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify application JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (semver tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write published image tags to Job Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published Container Image Tags"
            echo ""
            echo "| Image Tag | Platforms | Digest |"
            echo "| :--- | :--- | :--- |"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "| \`$tag\` | \`linux/amd64, linux/arm64\` | \`$DIGEST\` |"
            done <<< "$TAGS"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: steasdal/gitops
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Update production image tag in GitOps repository
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          RELEASE_IMAGE=$(grep -v ':latest$' <<< "$TAGS" | grep -v '^$' | head -n 1)
          if [ -z "$RELEASE_IMAGE" ]; then
            echo "Error: Could not find release version tag in metadata output"
            exit 1
          fi
          echo "Updating apps/gridtube/prod/02-app.yaml to image: ${RELEASE_IMAGE}"
          cd gitops
          sed -i -E "s|(image:[[:space:]]*)ghcr\.io/steasdal/gridtube:[^[:space:]]+|\1${RELEASE_IMAGE}|" apps/gridtube/prod/02-app.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet apps/gridtube/prod/02-app.yaml; then
            echo "No changes to commit in apps/gridtube/prod/02-app.yaml"
          else
            git add apps/gridtube/prod/02-app.yaml
            git commit -m "chore(gridtube): update production image to ${RELEASE_IMAGE#*:}"
            git pull --rebase origin main
            git push origin main
            echo "Updated \`steasdal/gitops\` (\`apps/gridtube/prod/02-app.yaml\`) to \`${RELEASE_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
