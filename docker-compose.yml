services:
  postgres:
    image: postgres:16-alpine
    container_name: gridtube-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridtube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridtube}
      POSTGRES_DB: ${POSTGRES_DB:-gridtube}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridtube} -d ${POSTGRES_DB:-gridtube}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  gridtube:
    build: .
    image: ghcr.io/steasdal/gridtube:${IMAGE_TAG:-latest}
    container_name: gridtube
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATA_DIR: /data
      DATABASE_URL: postgres://${POSTGRES_USER:-gridtube}:${POSTGRES_PASSWORD:-gridtube}@postgres:5432/${POSTGRES_DB:-gridtube}
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  postgres_data:
