apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gridtube-data
  labels:
    app: gridtube
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridtube
  labels:
    app: gridtube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gridtube
  template:
    metadata:
      labels:
        app: gridtube
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gridtube
          image: ghcr.io/steasdal/gridtube:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: "/data"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gridtube-data
---
apiVersion: v1
kind: Service
metadata:
  name: gridtube
  labels:
    app: gridtube
spec:
  type: ClusterIP
  selector:
    app: gridtube
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
